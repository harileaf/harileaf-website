    <!-- Top-right petal: circle with downward V notch at base -->
    <path d="M 42 33 L 37 27 A 12 12 0 1 1 47 27 Z"/>

    <!-- Center horizontal bar -->
    <rect x="2" y="33" width="52" height="6" rx="3"/>

    <!-- Center dividing line (slightly lighter) -->
    <rect x="2" y="36" width="52" height="1.5" fill="white" opacity="0.35"/>

    <!-- Bottom horizontal bar -->
    <rect x="2" y="33" width="52" height="6" rx="3"/>

    <!-- Bottom-left petal: circle with upward V notch at top -->
    <path d="M 14 39 L 9 45 A 12 12 0 1 0 19 45 Z"/>

    <!-- Bottom-right petal: circle with upward V notch at top -->
    <path d="M 42 39 L 37 45 A 12 12 0 1 0 47 45 Z"/>

