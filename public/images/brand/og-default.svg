<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7FC8BA"/>
      <stop offset="100%" stop-color="#9FB17D"/>
    </linearGradient>
    <linearGradient id="overlay" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#196A5E" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#546437" stop-opacity="0.9"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#overlay)"/>

  <!-- Decorative circles -->
  <circle cx="1050" cy="100" r="200" fill="white" fill-opacity="0.05"/>
  <circle cx="150"  cy="530" r="160" fill="white" fill-opacity="0.05"/>

  <!-- Logo mark: leaf shape -->
  <g transform="translate(540, 180)">
    <path d="M60 0 C100 20 120 80 60 120 C0 80 20 20 60 0Z" fill="white" fill-opacity="0.9"/>
    <path d="M60 10 L60 110" stroke="url(#bg)" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Brand name -->
  <text x="600" y="360" font-family="'Manrope', 'Helvetica Neue', sans-serif" font-size="72" font-weight="800" fill="white" text-anchor="middle" letter-spacing="-1">HariLeaf</text>
  <text x="600" y="420" font-family="'Manrope', 'Helvetica Neue', sans-serif" font-size="28" font-weight="400" fill="white" fill-opacity="0.8" text-anchor="middle" letter-spacing="2">AGRITECH</text>

  <!-- Tagline -->
  <text x="600" y="490" font-family="'Manrope', 'Helvetica Neue', sans-serif" font-size="20" font-weight="400" fill="white" fill-opacity="0.65" text-anchor="middle">Open-field farming reimagined</text>

  <!-- URL strip at bottom -->
  <rect y="570" width="1200" height="60" fill="black" fill-opacity="0.25"/>
  <text x="600" y="608" font-family="'Manrope', 'Helvetica Neue', sans-serif" font-size="18" fill="white" fill-opacity="0.7" text-anchor="middle">harileaf.org</text>
</svg>
