name = "harileaf"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

# Custom entry: Astro's fetch handler + scheduled() for store cron jobs.
main = "src/worker.ts"

# Only serve on the custom domains below. A *.workers.dev URL would bypass the
# Cloudflare Access policy that protects /admin on harileaf.org.
workers_dev = false

routes = [
  { pattern = "harileaf.org", custom_domain = true },
  { pattern = "www.harileaf.org", custom_domain = true }
]

[assets]
directory = "./dist/client"

[[kv_namespaces]]
binding = "HARILEAF_CMS"
id = "985fdea1a9594db6a58c722d5f8fe88f"

[[r2_buckets]]
binding = "HARILEAF_MEDIA"
bucket_name = "harileaf-media"

[[d1_databases]]
binding = "STORE_DB"
database_name = "harileaf-store"
database_id = "59357a9b-49d8-4e55-a4a4-ce2b457dbf0c"
migrations_dir = "migrations"

[triggers]
# Every 5 min: payment reconciliation, reservation expiry, refund re-checks,
# stuck-capture sweep, COD reminders. Every minute: the outbox drain (payment
# capture, emails, Shiprocket, cache purges) in its own invocation, so it has
# a full subrequest budget (src/lib/store/scheduled.ts DRAIN_CRON).
crons = ["*/5 * * * *", "* * * * *"]

[vars]
# Turnstile widget "HariLeaf Store" (public). .dev.vars overrides it with
# Cloudflare's always-pass test key, since this one only works on harileaf.org.
PUBLIC_TURNSTILE_SITE_KEY = "0x4AAAAAAFdgCACaacNRdXfz"

# Workers Free allows 50 subrequests (D1 queries, fetches, cache calls) per
# invocation. Until the Paid plan: no inline drain after a request (it has
# already used most of its budget), and a few outbox rows per minute from the
# cron. On Workers Paid, delete both lines (defaults: 10 and 50).
OUTBOX_DRAIN_SOON_LIMIT = "0"
OUTBOX_CRON_LIMIT = "4"

# Workers Logs: keeps the JSON console logs (order, payment, webhook, outbox
# failures) searchable in the dashboard. Included in Workers Paid.
[observability]
enabled = true

# Per-IP limits for checkout, pincode lookups and payment retries (Workers Rate Limiting).
[[ratelimits]]
name = "STORE_RATE_LIMITER"
namespace_id = "1001"
simple = { limit = 30, period = 60 }
